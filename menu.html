  <style>
    .menu { min-height: 100svh; }
    .menu__close { position: absolute; right: calc(33 * var(--u)); top: calc(29 * var(--u)); width: max(22px, calc(30 * var(--u))); height: max(22px, calc(27 * var(--u))); color: var(--olive); transition: color .3s; }
    .menu__close::before, .menu__close::after { content: ""; position: absolute; left: -10%; right: -10%; top: 50%; height: 1.5px; background: currentColor; transform: rotate(42deg); }
    .menu__close::after { transform: rotate(-42deg); }
    .menu__close:hover { color: var(--wine); }
    .menu__logo { text-align: center; color: var(--olive); }
    .menu__logo b { display: block; font-family: var(--serif); font-weight: 200; font-size: max(28px, calc(43 * var(--u))); line-height: 1; }
    .menu__logo small { display: block; font-size: max(10px, calc(14.3 * var(--u))); text-transform: uppercase; margin-top: calc(12 * var(--u)); }
    .menu__item { display: grid; place-items: center; height: calc(87 * var(--u)); min-height: 60px; font-family: var(--serif); font-weight: 200; font-size: max(26px, calc(36 * var(--u))); color: var(--navy); transition: background .3s, color .3s; }
    .menu__item:hover { background: var(--navy); color: var(--pink); }
    @media (max-width: 900px) { .menu .cv { justify-content: center; min-height: 100svh; } }
  </style>
</head>
